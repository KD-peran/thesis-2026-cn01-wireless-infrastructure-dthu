# ==============================================================
# FREERADIUS CONFIGURATION: clients.conf
# Khai báo máy khách WLC DTHU truy vấn xác thực
# ==============================================================

client dthu_wlc_cluster {
    ipaddr      = 172.16.50.10
    proto       = udp
    secret      = Dthu@RadiusSecret2026!
    shortname   = dthu-wlc
    nas_type    = cisco
}

client dthu_wlc_standby {
    ipaddr      = 172.16.50.11
    proto       = udp
    secret      = Dthu@RadiusSecret2026!
    shortname   = dthu-wlc-backup
    nas_type    = cisco
}
