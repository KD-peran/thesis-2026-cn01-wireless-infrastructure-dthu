name: Deploy Docsify to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'thu-tuc-khoa/**'
      - 'huong-dan/**'
      - 'Cau-truc-toan-repo.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Sync documents into docs directory
        run: |
          cp -r thu-tuc-khoa docs/
          cp -r huong-dan docs/
          cp Cau-truc-toan-repo.md docs/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
